{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <div class="sm:mx-auto w-full max-w-md">
        <div class="flex justify-center text-blue-600">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"></path>
            </svg>
        </div>
        <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-slate-900">Welcome to Admin Panel</h2>
        <p class="mt-2 text-center text-sm text-slate-500">Please enter your credentials to access management tools.</p>
    </div>

    <div class="mt-8 sm:mx-auto w-full max-w-md px-4 sm:px-0">
        <div class="bg-white py-8 px-4 shadow-md sm:rounded-xl border border-slate-200/80 sm:px-10">
            
            {% if form.non_field_errors or form.errors %}
            <div class="mb-5 bg-rose-50 border border-rose-200 rounded-lg p-4 text-sm text-rose-700">
                <div class="flex items-start">
                    <svg class="w-5 h-5 mr-2.5 flex-shrink-0 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <div>
                        <span class="font-semibold">Login failed:</span> Please check your username and password and try again.
                    </div>
                </div>
            </div>
            {% endif %}

            <form class="space-y-5" method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <div>
                    <label Lay for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">Username</label>
                    <div class="relative rounded-md shadow-xs">
                        <input type="text" 
                               id="username" 
                               name="username" 
                               value="{{ form.username.value|default:'' }}" 
                               class="block w-full rounded-lg border border-slate-300 bg-slate-50/50 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:outline-hidden transition-all duration-150 text-sm" 
                               placeholder="admin_username"
                               required>
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                    <div class="relative rounded-md shadow-xs">
                        <input type="password" 
                               id="password" 
                               name="password" 
                               value="{{ form.password.value|default:'' }}"  
                               class="block w-full rounded-lg border border-slate-300 bg-slate-50/50 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:outline-hidden transition-all duration-150 text-sm" 
                               placeholder="••••••••"
                               required>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="flex w-full justify-center rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-xs transition-all duration-150 hover:bg-blue-700 hover:shadow-md active:scale-[0.98] focus:outline-hidden focus:ring-2 focus:ring-blue-500/40">
                        Sign In to Panel
                    </button>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
